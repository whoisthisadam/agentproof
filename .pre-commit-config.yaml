repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: agentproof-validate
        name: agentproof validate (example portfolio)
        entry: agentproof --root examples/portfolio validate
        language: system
        pass_filenames: false
        files: ^examples/portfolio/
